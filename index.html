<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班級作業互評</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2433;--sub:#667085;--line:#dfe3ea;--accent:#2b5fd9;--ok:#1f8a4c;--bad:#c4372c;--dis:#eceef2}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--ink:#e8ebf2;--sub:#98a2b3;--line:#323946;--accent:#6e96f5;--ok:#4cc38a;--bad:#f0776d;--dis:#262c37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:1.5rem;margin:20px 0 4px}
.sub{color:var(--sub);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
select,input[type=text]{width:100%;padding:10px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.quota{position:sticky;top:0;z-index:5;display:flex;gap:8px;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.q{flex:1;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 2px;font-size:.9rem}
.q b{display:block;font-size:1.15rem}
.q.full{border-color:var(--bad);color:var(--bad)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .name{flex:1 1 180px;min-width:150px}
.row .name small{color:var(--sub);display:block}
.row.done{border-left:4px solid var(--ok)}
.btns{display:flex;gap:6px}
.btns button{width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btns button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btns button:disabled{background:var(--dis);color:var(--sub);cursor:not-allowed;opacity:.6}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
.bar .msg{flex:1;color:var(--sub);font-size:.9rem}
.submit{padding:12px 22px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.submit:disabled{background:var(--dis);color:var(--sub);cursor:not-allowed}
.hidden{display:none}
.notice{color:var(--ok);font-weight:600}
.err{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <p class="sub" id="rule"></p>

  <div class="card" id="whoCard">
    <label for="sname"><b>姓名</b></label>
    <input type="text" id="sname" autocomplete="name">
    <label for="sid" style="display:block;margin-top:10px"><b>學號</b></label>
    <input type="text" id="sid" autocomplete="off">
    <p class="sub" style="margin:8px 0 12px">你也要評自己的作業。每個學號只能送出一次。</p>
    <button class="submit" id="start" type="button">開始評分</button>
  </div>

  <div id="main" class="hidden">
    <div class="quota" id="quota"></div>
    <div id="list" style="margin-top:12px"></div>
  </div>

  <div class="card hidden" id="doneCard"><p class="notice">已送出,謝謝你的評分!</p></div>
</div>

<div class="bar hidden" id="bar"><div class="in">
  <div class="msg" id="msg"></div>
  <button class="submit" id="submit" disabled>送出評分</button>
</div></div>

<script>
/* ========== 設定區:改這裡就好 ========== */
const CONFIG = {
  title: "班級作業互評",
  // 貼上 Google Apps Script 部署後的網頁應用程式網址(見 Code.gs 說明);留空則為測試模式
  endpoint: "",
  // 學生名單:座號依序為 1~64。把「同學01」換成真實姓名;也可在姓名後用 | 附上作業連結,如 "王小明|https://..."
  students: Array.from({length: 64}, (_, i) => "同學" + String(i + 1).padStart(2, "0")),
  limits: {5: 12, 4: 12, 3: 12}   // 各分數人數上限;1、2 分不限
};
/* ====================================== */

const S = CONFIG.students.map((s, i) => { const [name, link] = s.split("|"); return {id: i + 1, name, link}; });
const $ = id => document.getElementById(id);
let me = null, ratings = {};

$("title").textContent = CONFIG.title;
$("rule").textContent = `請為每位同學的作業打 1~5 分(5 分最高)。3、4、5 分各最多 ${CONFIG.limits[5]} 人,每位同學都必須評分。`;

$("start").onclick = () => {
  const name = $("sname").value.trim(), id = $("sid").value.trim();
  if (!name || !id) { alert("請先填寫姓名和學號。"); return; }
  if (localStorage.getItem("rated_" + id)) { alert("這個學號已經送出過評分了。"); return; }
  me = {id, name}; ratings = {};
  ["sname", "sid", "start"].forEach(k => $(k).disabled = true);
  $("main").classList.remove("hidden"); $("bar").classList.remove("hidden");
  render();
};

const count = v => Object.values(ratings).filter(x => x === v).length;
const targets = () => S;

function render() {
  $("list").innerHTML = targets().map(s => `
    <div class="card row" id="r${s.id}">
      <div class="name"><b>${s.id} 號 ${s.name}</b>${s.link ? `<small><a href="${s.link}" target="_blank" rel="noopener">查看作業</a></small>` : ""}</div>
      <div class="btns" role="group" aria-label="${s.name} 的分數">
        ${[1,2,3,4,5].map(v => `<button type="button" data-id="${s.id}" data-v="${v}">${v}</button>`).join("")}
      </div>
    </div>`).join("");
  $("list").onclick = e => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    const id = +b.dataset.id, v = +b.dataset.v;
    if (ratings[id] === v) delete ratings[id]; else ratings[id] = v;
    update();
  };
  update();
}

function update() {
  $("quota").innerHTML = [5,4,3].map(v => {
    const c = count(v), full = c >= CONFIG.limits[v];
    return `<div class="q ${full ? "full" : ""}">${v} 分<b>${c} / ${CONFIG.limits[v]}</b></div>`;
  }).join("") + `<div class="q">已評<b>${Object.keys(ratings).length} / ${targets().length}</b></div>`;

  document.querySelectorAll("#list button").forEach(b => {
    const id = +b.dataset.id, v = +b.dataset.v, on = ratings[id] === v;
    b.classList.toggle("on", on);
    b.disabled = !on && CONFIG.limits[v] !== undefined && count(v) >= CONFIG.limits[v];
  });
  targets().forEach(s => $("r" + s.id).classList.toggle("done", ratings[s.id] !== undefined));

  const left = targets().length - Object.keys(ratings).length;
  $("submit").disabled = left > 0;
  $("msg").textContent = left > 0 ? `還有 ${left} 位同學未評分` : "全部完成,可以送出了";
}

$("submit").onclick = async () => {
  const btn = $("submit"); btn.disabled = true; btn.textContent = "送出中…";
  const payload = {studentId: me.id, name: me.name, ratings, total: S.length};
  try {
    if (CONFIG.endpoint) {
      const res = await fetch(CONFIG.endpoint, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(payload)});
      const out = await res.json();
      if (!out.ok) throw new Error(out.error || "送出失敗");
    } else {
      console.log("測試模式,未設定 endpoint,資料如下:", payload);
    }
    localStorage.setItem("rated_" + me.id, "1");
    $("main").classList.add("hidden"); $("bar").classList.add("hidden"); $("whoCard").classList.add("hidden");
    $("doneCard").classList.remove("hidden");
    if (!CONFIG.endpoint) $("doneCard").insertAdjacentHTML("beforeend", '<p class="err">目前是測試模式,資料沒有被儲存。請先設定 endpoint。</p>');
  } catch (err) {
    alert("送出失敗:" + err.message + "\n請稍後再試,或通知老師。");
    btn.disabled = false; btn.textContent = "送出評分";
  }
};
</script>
</body>
</html>
